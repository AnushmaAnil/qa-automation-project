<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>ShopEasy</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<header>
  <h1><a href="/">ShopEasy</a></h1>
  {% if session.get('user') %}
  <nav>
    <a id="nav-products" href="{{ url_for('products') }}">Products</a>
    <a id="nav-cart" href="{{ url_for('cart_page') }}">Cart (<span id="cart-count">{{ cart_count }}</span>)</a>
    <a id="logout-link" href="{{ url_for('logout') }}">Logout</a>
  </nav>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body></html>
